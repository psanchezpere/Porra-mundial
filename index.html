<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WC·2026·PORRA</title>
<style>
*{-webkit-box-sizing:border-box;box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
input,button,select{-webkit-appearance:none;appearance:none;font-size:16px;}
:root{
  --bg:#070f1a;--surf:#0a1628;--surf2:#0d1f38;
  --c:#00ffc8;--c12:rgba(0,255,200,.12);--c25:rgba(0,255,200,.25);--c40:rgba(0,255,200,.40);
  --gold:#f0b429;--text:#e8f4f0;--t2:#7a9e96;--t3:#3a5e58;
  --bdr:rgba(0,255,200,.14);--bdr2:rgba(0,255,200,.30);
  --hh:54px;--nh:56px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
html{background:var(--bg);height:100%;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:14px;padding-top:calc(var(--hh) + var(--sat));padding-bottom:calc(var(--nh) + var(--sab));min-height:100%;-webkit-overflow-scrolling:touch;}

/* HEADER */
#hdr{position:fixed;top:0;left:0;right:0;height:calc(var(--hh) + var(--sat));padding-top:var(--sat);background:rgba(7,15,26,.97);border-bottom:1px solid var(--bdr2);z-index:500;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;padding-left:14px;padding-right:14px;}
#hdr-logo{font-weight:800;font-size:13px;color:var(--c);letter-spacing:3px;text-transform:uppercase;}
.hdr-right{display:-webkit-flex;display:flex;gap:8px;-webkit-align-items:center;align-items:center;}
#sync-status{font-size:10px;letter-spacing:1px;color:var(--t2);}
#sync-status.ok{color:var(--c);}
#sync-status.err{color:#ff6b6b;}
#sync-status.loading{color:var(--gold);}
#btn-tt{background:var(--c12);border:1px solid var(--bdr2);color:var(--c);font-size:11px;letter-spacing:1px;font-weight:700;padding:7px 11px;border-radius:6px;cursor:pointer;white-space:nowrap;text-transform:uppercase;}

/* NAV */
#nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nh) + var(--sab));padding-bottom:var(--sab);background:rgba(7,15,26,.97);border-top:1px solid var(--bdr2);z-index:500;display:-webkit-flex;display:flex;}
.nb{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;gap:2px;border:none;background:transparent;color:var(--t2);font-size:9px;letter-spacing:1px;min-height:44px;cursor:pointer;position:relative;text-transform:uppercase;font-weight:600;}
.nb .ni{font-size:20px;line-height:1.2;}
.nb.on{color:var(--c);}
.nb.on::before{content:'';position:absolute;top:0;left:20%;right:20%;height:2px;background:var(--c);border-radius:0 0 2px 2px;}

/* PÁGINAS */
.pg{display:none;padding:12px;}
.pg.on{display:block;}

/* LOADING */
#loadscreen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;gap:16px;}
#loadscreen h2{color:var(--c);font-size:14px;letter-spacing:4px;text-transform:uppercase;}
#loadscreen p{color:var(--t2);font-size:11px;letter-spacing:2px;}
.spinner{width:36px;height:36px;border:3px solid var(--bdr);border-top-color:var(--c);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* STAT CARDS */
.sgrid{display:-webkit-flex;display:flex;gap:7px;margin-bottom:14px;}
.sc{-webkit-flex:1;flex:1;background:var(--surf);border:1px solid var(--bdr);border-radius:10px;padding:10px 4px;text-align:center;min-width:0;}
.sv{font-size:17px;font-weight:800;color:var(--c);}
.sl{font-size:8px;color:var(--t2);letter-spacing:1px;margin-top:2px;text-transform:uppercase;}

/* RANKING */
.rrow{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;margin-bottom:8px;overflow:hidden;cursor:pointer;}
.rrow.open{border-color:var(--c25);}
.rhead{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:10px 12px;gap:10px;}
.rpos{font-size:16px;min-width:26px;text-align:center;}
.rbar{width:4px;height:38px;background:var(--bdr);border-radius:2px;position:relative;overflow:hidden;-webkit-flex-shrink:0;flex-shrink:0;}
.rbarfill{position:absolute;bottom:0;left:0;right:0;background:var(--c40);border-radius:2px;}
.rinfo{-webkit-flex:1;flex:1;min-width:0;}
.rname{font-size:13px;font-weight:700;color:var(--text);letter-spacing:.5px;}
.rsub{font-size:10px;color:var(--t2);margin-top:2px;}
.rpts{font-size:24px;font-weight:800;color:var(--c);}
.rchev{font-size:12px;color:var(--t3);-webkit-transition:transform .2s;transition:transform .2s;-webkit-flex-shrink:0;flex-shrink:0;}
.rrow.open .rchev{-webkit-transform:rotate(180deg);transform:rotate(180deg);color:var(--c);}
.rdet{display:none;border-top:1px solid var(--bdr);}
.rrow.open .rdet{display:block;}
.rdhead{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:center;align-items:center;padding:10px 12px;background:var(--surf2);}
.rdtitle{font-size:11px;color:var(--c);letter-spacing:2px;font-weight:700;text-transform:uppercase;}
.rdtotal{font-size:16px;font-weight:800;color:var(--gold);}
.rdscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.rdtbl{min-width:540px;width:100%;border-collapse:collapse;font-size:11px;}
.rdtbl th{background:var(--surf2);color:var(--t2);font-size:9px;letter-spacing:1px;padding:6px 7px;text-align:center;border-bottom:1px solid var(--bdr);white-space:nowrap;text-transform:uppercase;}
.rdtbl td{padding:6px 7px;border-bottom:1px solid var(--bdr);text-align:center;vertical-align:middle;}
.rdtbl td.tdm{text-align:left;white-space:nowrap;font-size:10px;}
.rdtbl tr.jsep td{background:var(--surf2);color:var(--t2);font-size:9px;letter-spacing:2px;padding:5px 7px;text-align:left;font-weight:700;text-transform:uppercase;}
.chp{display:inline-block;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700;white-space:nowrap;}
.chp-g{background:rgba(240,180,41,.18);color:var(--gold);border:1px solid rgba(240,180,41,.4);}
.chp-c{background:var(--c12);color:var(--c);border:1px solid var(--bdr2);}
.chp-0{background:rgba(255,255,255,.04);color:var(--t3);border:1px solid rgba(255,255,255,.1);}
.chp-d{background:rgba(255,255,255,.02);color:var(--t3);border:1px solid rgba(255,255,255,.06);font-style:italic;}
.dimchp{opacity:.4;}

/* PICKS */
.fgrid{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.fw{width:100%;}
.selw{background:var(--surf);border:1px solid var(--bdr2);border-radius:8px;padding:2px 10px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:6px;-webkit-flex:1;flex:1;min-width:120px;}
.selw label{font-size:9px;color:var(--t2);letter-spacing:1px;white-space:nowrap;text-transform:uppercase;font-weight:700;}
.selw select{-webkit-flex:1;flex:1;background:transparent;border:none;color:var(--c);font-size:12px;font-weight:700;outline:none;padding:9px 0;-webkit-appearance:none;cursor:pointer;min-width:0;}
.selw select option{background:#0a1628;color:#e8f4f0;}
.pkempty{text-align:center;padding:50px 20px;font-size:11px;color:var(--t3);letter-spacing:2px;text-transform:uppercase;}
.pkitem{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;margin-bottom:8px;padding:10px 12px;}
.pktop{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:8px;}
.pkbadge{font-size:9px;color:var(--t2);background:var(--surf2);border:1px solid var(--bdr);padding:2px 6px;border-radius:4px;white-space:nowrap;text-transform:uppercase;font-weight:700;-webkit-flex-shrink:0;flex-shrink:0;}
.pkteams{-webkit-flex:1;flex:1;font-size:11px;color:var(--text);min-width:0;}
.pkscore{font-size:19px;font-weight:800;color:var(--c);letter-spacing:2px;-webkit-flex-shrink:0;flex-shrink:0;font-family:'Courier New',monospace;}
.pksub{font-size:10px;color:var(--t2);margin-top:4px;}
.gsep{font-size:9px;letter-spacing:3px;color:var(--t3);padding:10px 0 5px;border-bottom:1px solid var(--bdr);margin-bottom:8px;text-transform:uppercase;font-weight:700;}

/* SCORES */
.fpills{display:-webkit-flex;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px;margin-bottom:12px;scrollbar-width:none;}
.fpills::-webkit-scrollbar{display:none;}
.pill{-webkit-flex-shrink:0;flex-shrink:0;padding:7px 13px;border-radius:20px;border:1px solid var(--bdr2);background:transparent;color:var(--t2);font-size:10px;letter-spacing:1px;cursor:pointer;white-space:nowrap;font-weight:700;text-transform:uppercase;min-height:36px;}
.pill.on{background:var(--c12);color:var(--c);border-color:var(--c40);}
.scitem{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;margin-bottom:8px;padding:11px 12px;}
.sctop{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:8px;margin-bottom:9px;}
.scgrp{font-size:9px;color:var(--t2);background:var(--surf2);border:1px solid var(--bdr);padding:2px 7px;border-radius:4px;text-transform:uppercase;font-weight:700;}
.dot-ok{width:8px;height:8px;border-radius:50%;background:var(--c);-webkit-flex-shrink:0;flex-shrink:0;}
.dot-pend{width:8px;height:8px;border-radius:50%;background:var(--t3);-webkit-flex-shrink:0;flex-shrink:0;}
.scdate{font-size:10px;color:var(--t2);}
.scrow{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:7px;}
.scteam{-webkit-flex:1;flex:1;font-size:11px;color:var(--text);text-align:right;min-width:0;}
.scteam.r{text-align:left;}
.scdash{font-size:16px;color:var(--t3);font-weight:700;-webkit-flex-shrink:0;flex-shrink:0;}
.scinp{width:46px;height:46px;background:var(--surf2);border:1px solid var(--bdr2);border-radius:8px;color:var(--c);font-size:22px;font-weight:800;text-align:center;font-family:'Courier New',monospace;outline:none;}
.scinp:focus{border-color:var(--c);}
.scsave{margin-top:9px;width:100%;padding:11px;background:var(--c12);border:1px solid var(--bdr2);border-radius:8px;color:var(--c);font-size:12px;letter-spacing:2px;cursor:pointer;font-weight:700;text-transform:uppercase;min-height:44px;}
.scsave:disabled{opacity:.5;cursor:not-allowed;}
.scok{font-size:11px;color:var(--c);text-align:center;margin-top:6px;letter-spacing:1px;display:none;font-weight:700;}
.scerr{font-size:11px;color:#ff6b6b;text-align:center;margin-top:6px;letter-spacing:1px;display:none;font-weight:700;}

/* CONFIG */
.cfgsec{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;padding:14px;margin-bottom:12px;}
.cfgtitle{font-size:11px;color:var(--c);letter-spacing:2px;margin-bottom:12px;font-weight:700;text-transform:uppercase;}
.cfgrow{display:-webkit-flex;display:flex;gap:8px;margin-bottom:8px;}
.cfginp{-webkit-flex:1;flex:1;background:var(--surf2);border:1px solid var(--bdr2);border-radius:8px;color:var(--text);font-size:16px;padding:10px 12px;outline:none;min-height:44px;}
.cfginp:focus{border-color:var(--c);}
.cfgbtn{padding:10px 14px;background:var(--c12);border:1px solid var(--bdr2);border-radius:8px;color:var(--c);font-size:11px;letter-spacing:1px;cursor:pointer;white-space:nowrap;font-weight:700;text-transform:uppercase;min-height:44px;}
.taglist{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;gap:6px;}
.tag{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:4px;background:var(--c12);border:1px solid var(--bdr2);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--c);font-weight:600;}
.tagx{background:none;border:none;color:var(--t2);cursor:pointer;font-size:16px;padding:0 2px;min-height:0;}
.pchips{display:-webkit-flex;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:10px;padding-bottom:4px;scrollbar-width:none;}
.pchips::-webkit-scrollbar{display:none;}
.pchip{-webkit-flex-shrink:0;flex-shrink:0;padding:7px 14px;border-radius:20px;border:1px solid var(--bdr2);background:transparent;color:var(--t2);font-size:10px;letter-spacing:1px;cursor:pointer;font-weight:700;text-transform:uppercase;min-height:36px;}
.pchip.on{background:var(--c12);color:var(--c);border-color:var(--c40);}
.pgfilt{display:-webkit-flex;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:10px;scrollbar-width:none;}
.pgfilt::-webkit-scrollbar{display:none;}
.prgrp{margin-bottom:12px;}
.prgtitle{font-size:9px;color:var(--t2);letter-spacing:2px;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--bdr);text-transform:uppercase;font-weight:700;}
.prrow{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:6px;margin-bottom:8px;}
.prteam{font-size:11px;color:var(--text);-webkit-flex:1;flex:1;min-width:0;}
.prteam.r{text-align:right;}
.prinp{width:38px;height:38px;background:var(--surf2);border:1px solid var(--bdr);border-radius:6px;color:var(--c);font-size:16px;font-weight:800;text-align:center;font-family:'Courier New',monospace;outline:none;}
.prinp:focus{border-color:var(--c);}
.prsep{font-size:14px;color:var(--t3);font-weight:700;-webkit-flex-shrink:0;flex-shrink:0;}
.savebtn{width:100%;padding:14px;background:rgba(0,255,200,.14);border:1px solid var(--c40);border-radius:10px;color:var(--c);font-size:12px;letter-spacing:2px;cursor:pointer;margin-top:8px;font-weight:700;text-transform:uppercase;min-height:44px;}
.savebtn:disabled{opacity:.5;cursor:not-allowed;}
.info-box{background:var(--surf2);border:1px solid var(--bdr);border-radius:8px;padding:12px;margin-bottom:12px;font-size:11px;color:var(--t2);line-height:1.7;}
.info-box strong{color:var(--c);}

/* TELETEXTO */
body.tt,body.tt *{font-family:'Courier New',Courier,monospace !important;border-radius:0 !important;letter-spacing:0 !important;}
body.tt{background:#000 !important;color:#ffff00 !important;}
body.tt #hdr{background:#0000aa !important;border-bottom:2px solid #ffff00 !important;}
body.tt #hdr-logo{color:#00ffff !important;}
body.tt #btn-tt{background:#ffff00 !important;color:#000 !important;border:2px solid #ffff00 !important;}
body.tt #nav{background:#0000aa !important;border-top:2px solid #ffff00 !important;}
body.tt .nb{color:#00ff00 !important;}
body.tt .nb.on{color:#ffff00 !important;}
body.tt .nb.on::before{background:#ffff00 !important;}
body.tt .sc{background:#000088 !important;border:2px solid #00ffff !important;}
body.tt .sv{color:#ffff00 !important;}
body.tt .sl{color:#00ffff !important;}
body.tt .rrow{background:#000066 !important;border:2px solid #ffff00 !important;}
body.tt .rrow.open{border-color:#00ffff !important;}
body.tt .rpts{color:#ffff00 !important;}
body.tt .rname{color:#00ffff !important;}
body.tt .rsub{color:#00ff00 !important;}
body.tt .rdhead{background:#000033 !important;}
body.tt .rdtitle{color:#00ffff !important;}
body.tt .rdtotal{color:#ffff00 !important;}
body.tt .rdtbl th{background:#000033 !important;color:#00ffff !important;border-bottom:2px solid #ffff00 !important;}
body.tt .rdtbl td{border-bottom:1px solid #222200 !important;}
body.tt .rdtbl tr.jsep td{background:#000033 !important;color:#00ff00 !important;}
body.tt .chp-g{background:#333300 !important;color:#ffff00 !important;border:1px solid #ffff00 !important;}
body.tt .chp-c{background:#003333 !important;color:#00ffff !important;border:1px solid #00ffff !important;}
body.tt .chp-0{background:#111 !important;color:#555 !important;border:1px solid #333 !important;}
body.tt .pkitem{background:#000066 !important;border:2px solid #00ffff !important;}
body.tt .pkscore{color:#ffff00 !important;}
body.tt .gsep{color:#00ff00 !important;border-color:#333300 !important;}
body.tt .scitem{background:#000066 !important;border:2px solid #00ffff !important;}
body.tt .scinp{background:#000033 !important;border:2px solid #ffff00 !important;color:#ffff00 !important;}
body.tt .scsave{background:#003300 !important;border:2px solid #00ff00 !important;color:#00ff00 !important;}
body.tt .cfgsec{background:#000066 !important;border:2px solid #00ffff !important;}
body.tt .cfginp{background:#000033 !important;border:2px solid #ffff00 !important;color:#ffff00 !important;}
body.tt .cfgbtn{background:#003300 !important;border:2px solid #00ff00 !important;color:#00ff00 !important;}
body.tt .tag{background:#003300 !important;border:1px solid #00ff00 !important;color:#00ff00 !important;}
body.tt .prinp{background:#000033 !important;border:2px solid #ffff00 !important;color:#ffff00 !important;}
body.tt .savebtn{background:#330000 !important;border:2px solid #ff4400 !important;color:#ff4400 !important;}
body.tt .pchip.on{background:#003300 !important;color:#00ff00 !important;border-color:#00ff00 !important;}
body.tt .selw{background:#000088 !important;border:2px solid #ffff00 !important;}
body.tt .selw select{color:#ffff00 !important;}
body.tt .rbarfill{background:#ffff00 !important;}
body.tt .cfgtitle{color:#00ffff !important;}
body.tt .dot-ok{background:#00ff00 !important;}
body.tt .pill.on{background:#003300 !important;color:#00ff00 !important;border-color:#00ff00 !important;}
body.tt .pkbadge{background:#000033 !important;border-color:#00ffff !important;color:#00ffff !important;}
body.tt .scgrp{background:#000033 !important;border-color:#00ffff !important;color:#00ffff !important;}
body.tt #sync-status.ok{color:#00ff00 !important;}
body.tt #sync-status.loading{color:#ffff00 !important;}
body.tt #sync-status.err{color:#ff4400 !important;}
</style>
</head>
<body>

<div id="loadscreen">
  <div class="spinner"></div>
  <h2>⬡ WC·2026·PORRA</h2>
  <p id="load-msg">Conectando...</p>
</div>

<header id="hdr">
  <div id="hdr-logo">⬡ WC·2026·PORRA</div>
  <div class="hdr-right">
    <span id="sync-status">●</span>
    <button id="btn-tt" onclick="toggleTT()">📺 TELETEXTO</button>
  </div>
</header>

<div id="pg-ranking" class="pg on">
  <div class="sgrid" id="statcards"></div>
  <div id="ranklist"></div>
</div>

<div id="pg-picks" class="pg">
  <div class="fgrid">
    <div class="fw">
      <div class="selw">
        <label>Jugador</label>
        <select id="pk-par" onchange="renderPicks()"><option value="">— Selecciona —</option></select>
      </div>
    </div>
    <div class="selw">
      <label>Grupo</label>
      <select id="pk-grp" onchange="renderPicks()">
        <option value="">Todos</option>
        <option>A</option><option>B</option><option>C</option><option>D</option>
        <option>E</option><option>F</option><option>G</option><option>H</option>
        <option>I</option><option>J</option><option>K</option><option>L</option>
      </select>
    </div>
    <div class="selw">
      <label>Jornada</label>
      <select id="pk-jor" onchange="renderPicks()">
        <option value="">Todas</option>
        <option value="1">J1</option>
        <option value="2">J2</option>
        <option value="3">J3</option>
      </select>
    </div>
  </div>
  <div id="picklist"></div>
</div>

<div id="pg-scores" class="pg">
  <div class="info-box">
    <strong>Solo tú ves esta pestaña.</strong> Los resultados que guardes aquí se sincronizan con la nube y todos los participantes verán el ranking actualizado.
  </div>
  <div class="fpills" id="scorepills"></div>
  <div id="scorelist"></div>
</div>

<div id="pg-config" class="pg">
  <div class="cfgsec">
    <div class="cfgtitle">▸ Participantes</div>
    <div class="info-box">Los participantes se guardan en la nube. <strong>Todos comparten la misma lista.</strong></div>
    <div class="cfgrow">
      <input class="cfginp" id="cfg-np" placeholder="Nombre participante" type="text" autocorrect="off" autocapitalize="words">
      <button class="cfgbtn" onclick="addPart()">+ Añadir</button>
    </div>
    <div class="taglist" id="parttags"></div>
  </div>
  <div class="cfgsec">
    <div class="cfgtitle">▸ Pronósticos</div>
    <div class="pchips" id="cfgpartchips"></div>
    <div class="pgfilt" id="cfggrppills"></div>
    <div id="cfgform"></div>
    <button class="savebtn" id="savepronobtn" onclick="saveAllPronos()">▸ Guardar Pronósticos</button>
  </div>
</div>

<nav id="nav">
  <button class="nb on" id="nb-ranking" onclick="goPage('ranking')">
    <span class="ni">🏆</span><span>RANKING</span>

/* =====================================================
   JSONBIN API
===================================================== */
function setSyncStatus(state, text) {
  var el = document.getElementById('sync-status');
  el.className = state;
  el.textContent = text || (state === 'ok' ? '● Sync' : state === 'loading' ? '● ...' : '● Error');
}

function binRead(cb) {
  setSyncStatus('loading', '● ...');
  var xhr = new XMLHttpRequest();
  xhr.open('GET', BIN_URL + '/latest', true);
  xhr.setRequestHeader('X-Master-Key', X_KEY);
  xhr.setRequestHeader('X-Bin-Meta', 'false');
  xhr.onload = function() {
    if (xhr.status === 200) {
      try {
        var data = JSON.parse(xhr.responseText);
        setSyncStatus('ok', '● OK');
        cb(null, data);
      } catch(e) {
        setSyncStatus('err', '● Error');
        cb(e, null);
      }
    } else {
      setSyncStatus('err', '● ' + xhr.status);
      cb(new Error('HTTP ' + xhr.status), null);
    }
  };
  xhr.onerror = function() {
    setSyncStatus('err', '● Sin red');
    cb(new Error('network'), null);
  };
  xhr.send();
}

function binWrite(data, cb) {
  setSyncStatus('loading', '● ...');
  var xhr = new XMLHttpRequest();
  xhr.open('PUT', BIN_URL, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.setRequestHeader('X-Master-Key', X_KEY);
  xhr.onload = function() {
    if (xhr.status === 200) {
      setSyncStatus('ok', '● Guardado');
      if (cb) cb(null);
    } else {
      setSyncStatus('err', '● Error ' + xhr.status);
      if (cb) cb(new Error('HTTP ' + xhr.status));
    }
  };
  xhr.onerror = function() {
    setSyncStatus('err', '● Sin red');
    if (cb) cb(new Error('network'));
  };
  xhr.send(JSON.stringify(data));
}

function getCurrentData() {
  return { participantes: parts, pronos: pronos, resultados: reales };
}

===================================================== */
function ps(s) {
  if (!s) return null;
  var p = s.split('-');
  if (p.length !== 2) return null;
  var a = parseInt(p[0], 10), b = parseInt(p[1], 10);
  if (isNaN(a) || isNaN(b)) return null;
  return {l: a, v: b};
}
function r12x(l, v) { return l > v ? '1' : l < v ? '2' : 'X'; }
function calcPts(pick, real) {
  var p = ps(pick), r = ps(real);
  if (!p || !r) return {t:0,ex:false,r1:false,gl:false,gv:false};
  var ex = (p.l === r.l && p.v === r.v);
  var r1 = !ex && r12x(p.l, p.v) === r12x(r.l, r.v);
  var gl = !ex && p.l === r.l;
  var gv = !ex && p.v === r.v;
  var t = ex ? 7 : (r1 ? 2 : 0) + (gl ? 1 : 0) + (gv ? 1 : 0);
  return {t:t, ex:ex, r1:r1, gl:gl, gv:gv};
}
function totalPts(n) {
  var t = 0;
  for (var i = 0; i < P.length; i++) {
    var re = reales[P[i].id];
    if (!re) continue;
    var pk = pronos[n] ? pronos[n][P[i].id] : null;
    if (!pk) continue;
    t += calcPts(pk, re).t;
  }
  return t;
}
function jugados() { var c = 0; for (var i = 0; i < P.length; i++) if (reales[P[i].id]) c++; return c; }
function exactosDe(n) {
  var c = 0;
  for (var i = 0; i < P.length; i++) {
    var re = reales[P[i].id];
    if (!re) continue;
    var pk = pronos[n] ? pronos[n][P[i].id] : null;
    if (!pk) continue;
    if (calcPts(pk, re).ex) c++;
  }
  return c;
}

/* =====================================================
   RANKING
===================================================== */
function renderRanking() {
  var sc = [];
  for (var i = 0; i < parts.length; i++)
    sc.push({n: parts[i], pts: totalPts(parts[i]), ex: exactosDe(parts[i])});
  sc.sort(function(a, b) { return b.pts - a.pts; });
  var mx = sc.length ? Math.max(sc[0].pts, 1) : 1;
  var jug = jugados();
  document.getElementById('statcards').innerHTML =
    '<div class="sc"><div class="sv">' + parts.length + '</div><div class="sl">Jugadores</div></div>' +
    '<div class="sc"><div class="sv">' + (sc.length ? sc[0].pts : 0) + '</div><div class="sl">Líder pts</div></div>' +
    '<div class="sc"><div class="sv">' + jug + '</div><div class="sl">Jugados</div></div>' +
    '<div class="sc"><div class="sv">72</div><div class="sl">Total</div></div>';
  var md = ['🥇','🥈','🥉'];
  var h = '';
  for (var i = 0; i < sc.length; i++) {
    var s = sc[i];
    var bh = Math.round(s.pts / mx * 100);
    var pos = i < 3 ? md[i] : (i + 1) + '';
    h += '<div class="rrow" id="rr-' + i + '" onclick="togRank(' + i + ',\'' + esc(s.n) + '\')">' +
      '<div class="rhead">' +
        '<div class="rpos">' + pos + '</div>' +
        '<div class="rbar"><div class="rbarfill" style="height:' + bh + '%"></div></div>' +
        '<div class="rinfo">' +
          '<div class="rname">' + esc(s.n) + '</div>' +
          '<div class="rsub">' + jug + ' jugados · ' + s.ex + ' exactos</div>' +
        '</div>' +
        '<div class="rpts">' + s.pts + '</div>' +
        '<div class="rchev">▼</div>' +
      '</div>' +
      '<div class="rdet" id="rd-' + i + '"></div>' +
    '</div>';
  }
  document.getElementById('ranklist').innerHTML = h;
}

function togRank(idx, n) {
  var row = document.getElementById('rr-' + idx);
  var det = document.getElementById('rd-' + idx);
  var was = row.className.indexOf('open') >= 0;
  var rows = document.getElementsByClassName('rrow');
  for (var i = 0; i < rows.length; i++) rows[i].className = 'rrow';
  if (!was) {
    row.className = 'rrow open';
    det.innerHTML = buildBD(n);
  }
}

function buildBD(n) {
  var tot = totalPts(n);
  var h = '<div class="rdhead"><span class="rdtitle">' + esc(n) + '</span><span class="rdtotal">' + tot + ' pts</span></div>' +
    '<div class="rdscroll"><table class="rdtbl">' +
    '<thead><tr><th>Grp</th><th>Partido</th><th>Pick</th><th>Real</th><th>Exacto</th><th>1X2</th><th>G.Loc</th><th>G.Vis</th><th>Tot</th></tr></thead><tbody>';
  var lj = 0;
  for (var i = 0; i < P.length; i++) {
    var p = P[i];
    if (p.j !== lj) {
      h += '<tr class="jsep"><td colspan="9">▸ JORNADA ' + p.j + ' — ' + (p.j===1?'11-17 Jun':p.j===2?'18-23 Jun':'24-27 Jun') + '</td></tr>';
      lj = p.j;
    }
    var pk = pronos[n] ? pronos[n][p.id] : null;
    var re = reales[p.id];
    var pts = pk && re ? calcPts(pk, re) : null;
    var ce, cr, cgl, cgv, ct;
    if (!pk) { ce = cr = cgl = cgv = ct = '<span class="chp chp-d">—</span>'; }
    else if (!re) { ce = cr = cgl = cgv = ct = '<span class="chp chp-d">?</span>'; }
    else if (pts.ex) {
      ce = '<span class="chp chp-g">+7</span>';
      cr = cgl = cgv = '<span class="chp chp-0 dimchp">✓</span>';
      ct = '<span class="chp chp-g">7</span>';
    } else {
      ce = '<span class="chp chp-0">0</span>';
      cr = pts.r1 ? '<span class="chp chp-c">+2</span>' : '<span class="chp chp-0">0</span>';
      cgl = pts.gl ? '<span class="chp chp-c">+1</span>' : '<span class="chp chp-0">0</span>';
      cgv = pts.gv ? '<span class="chp chp-c">+1</span>' : '<span class="chp chp-0">0</span>';
      ct = pts.t > 0 ? '<span class="chp chp-c">' + pts.t + '</span>' : '<span class="chp chp-0">0</span>';
    }
    h += '<tr><td>' + p.g + '</td><td class="tdm">' + p.l.e + ' ' + p.l.n + ' vs ' + p.v.n + ' ' + p.v.e + '</td>' +
      '<td style="font-family:\'Courier New\',monospace">' + (pk || '—') + '</td>' +
      '<td style="color:var(--c);font-family:\'Courier New\',monospace">' + (re || '—') + '</td>' +
      '<td>' + ce + '</td><td>' + cr + '</td><td>' + cgl + '</td><td>' + cgv + '</td><td>' + ct + '</td></tr>';
  }
  h += '</tbody></table></div>';
  return h;
}

/* =====================================================
   PICKS
===================================================== */
function populatePkParts() {
  var sel = document.getElementById('pk-par');
  var cur = sel.value;
  sel.innerHTML = '<option value="">— Selecciona —</option>';
  for (var i = 0; i < parts.length; i++)
    sel.innerHTML += '<option value="' + esc(parts[i]) + '"' + (parts[i] === cur ? ' selected' : '') + '>' + esc(parts[i]) + '</option>';
}
function renderPicks() {
  var par = document.getElementById('pk-par').value;
  var grp = document.getElementById('pk-grp').value;
  var jor = document.getElementById('pk-jor').value;
  var el = document.getElementById('picklist');
  if (!par) { el.innerHTML = '<div class="pkempty">Selecciona un participante<br>para ver sus picks</div>'; return; }
  var pp = P.slice();
  if (grp) pp = pp.filter(function(x) { return x.g === grp; });
  if (jor) pp = pp.filter(function(x) { return x.j == jor; });
  var h = '', lg = '', lj = 0;
  for (var i = 0; i < pp.length; i++) {
    var p = pp[i];
    if (p.g !== lg) { h += '<div class="gsep">▸ Grupo ' + p.g + '</div>'; lg = p.g; lj = 0; }
    if (p.j !== lj) { h += '<div style="font-size:10px;color:var(--t3);margin:-3px 0 6px;font-weight:700;letter-spacing:1px;text-transform:uppercase">Jornada ' + p.j + '</div>'; lj = p.j; }
    var pk = pronos[par] ? pronos[par][p.id] : null;
    var re = reales[p.id];
    var pts = pk && re ? calcPts(pk, re) : null;
    var chi = '';
    if (pts) {
      if (pts.ex) chi = '<span class="chp chp-g">EXACTO +7</span>';
      else if (pts.t > 0) chi = '<span class="chp chp-c">+' + pts.t + '</span>';
      else chi = '<span class="chp chp-0">0</span>';
    } else if (pk && !re) chi = '<span class="chp chp-d">pdte</span>';
    h += '<div class="pkitem"><div class="pktop">' +
      '<span class="pkbadge">G' + p.g + ' J' + p.j + '</span>' +
      '<span class="pkteams">' + p.l.e + ' ' + p.l.n + ' — ' + p.v.n + ' ' + p.v.e + '</span>' +
      '<span class="pkscore">' + (pk || '—') + '</span>' + chi +
      '</div>' +
      (re ? '<div class="pksub">' + p.f + ' · Real: <strong style="color:var(--c)">' + re + '</strong></div>' : '<div class="pksub">' + p.f + '</div>') +
      '</div>';
  }
  el.innerHTML = h || '<div class="pkempty">Sin partidos</div>';
}

/* =====================================================
   SCORES
===================================================== */
function renderScores() {
  var gs = 'ABCDEFGHIJKL'.split('');
  var ph = '<button class="pill' + (scGrp === '' ? ' on' : '') + '" onclick="setScGrp(\'\')">Todos</button>';
  for (var i = 0; i < gs.length; i++)
    ph += '<button class="pill' + (scGrp === gs[i] ? ' on' : '') + '" onclick="setScGrp(\'' + gs[i] + '\')">G' + gs[i] + '</button>';
  document.getElementById('scorepills').innerHTML = ph;
  var pp = P.slice();
  if (scGrp) pp = pp.filter(function(x) { return x.g === scGrp; });
  var h = '';
  for (var i = 0; i < pp.length; i++) {
    var p = pp[i];
    var re = reales[p.id];
    var rl = '', rv = '';
    if (re) { var rp = re.split('-'); rl = rp[0]; rv = rp[1]; }
    h += '<div class="scitem">' +
      '<div class="sctop">' +
        '<span class="scgrp">G' + p.g + ' J' + p.j + '</span>' +
        (re ? '<div class="dot-ok"></div>' : '<div class="dot-pend"></div>') +
        '<span class="scdate">' + p.f + '</span>' +
      '</div>' +
      '<div class="scrow">' +
        '<div class="scteam">' + p.l.e + ' ' + p.l.n + '</div>' +
        '<input class="scinp" id="sl-' + p.id + '" type="number" inputmode="numeric" min="0" max="99" value="' + rl + '" placeholder="–">' +
        '<span class="scdash">–</span>' +
        '<input class="scinp" id="sv-' + p.id + '" type="number" inputmode="numeric" min="0" max="99" value="' + rv + '" placeholder="–">' +
        '<div class="scteam r">' + p.v.n + ' ' + p.v.e + '</div>' +
      '</div>' +
      '<button class="scsave" onclick="saveScore(\'' + p.id + '\')">Guardar</button>' +
      '<div class="scok" id="sok-' + p.id + '">▸ Guardado en la nube ✓</div>' +
      '<div class="scerr" id="serr-' + p.id + '">✗ Error al guardar</div>' +
    '</div>';
  }
  document.getElementById('scorelist').innerHTML = h;
}
function setScGrp(g) { scGrp = g; renderScores(); }
function saveScore(id) {
  var lv = document.getElementById('sl-' + id).value;
  var rv = document.getElementById('sv-' + id).value;
  if (lv === '' || rv === '') return;
  reales[id] = lv + '-' + rv;
  var btn = document.querySelector('[onclick="saveScore(\'' + id + '\')"]');
  if (btn) btn.disabled = true;
  binWrite(getCurrentData(), function(err) {
    if (btn) btn.disabled = false;
    var ok = document.getElementById('sok-' + id);
    var er = document.getElementById('serr-' + id);
    if (err) {
      er.style.display = 'block';
      setTimeout(function() { er.style.display = 'none'; }, 3000);
    } else {
      renderRanking();
      ok.style.display = 'block';
      setTimeout(function() { ok.style.display = 'none'; }, 2500);
      renderScores();
    }
  });
}

/* =====================================================
   CONFIG
===================================================== */
function renderConfig() {
  var t = '';
  for (var i = 0; i < parts.length; i++)
    t += '<div class="tag">' + esc(parts[i]) + '<button class="tagx" onclick="delPart(' + i + ')">✕</button></div>';
  document.getElementById('parttags').innerHTML = t;
  var pc = '';
  for (var i = 0; i < parts.length; i++)
    pc += '<button class="pchip' + (parts[i] === cfgPart ? ' on' : '') + '" onclick="setCfgPart(\'' + esc(parts[i]) + '\')">' + esc(parts[i]) + '</button>';
  document.getElementById('cfgpartchips').innerHTML = pc;
  var gs = 'ABCDEFGHIJKL'.split('');
  var gp = '<button class="pill' + (cfgGrp === '' ? ' on' : '') + '" onclick="setCfgGrp(\'\')">Todos</button>';
  for (var i = 0; i < gs.length; i++)
    gp += '<button class="pill' + (cfgGrp === gs[i] ? ' on' : '') + '" onclick="setCfgGrp(\'' + gs[i] + '\')">G' + gs[i] + '</button>';
  document.getElementById('cfggrppills').innerHTML = gp;
  renderPronoForm();
}
function setCfgPart(n) { cfgPart = n; renderConfig(); }
function setCfgGrp(g) { cfgGrp = g; renderConfig(); }
function renderPronoForm() {
  if (!cfgPart) {
    document.getElementById('cfgform').innerHTML = '<div style="text-align:center;padding:20px;font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:1px">Selecciona un jugador</div>';
    return;
  }
  var pp = P.slice();
  if (cfgGrp) pp = pp.filter(function(x) { return x.g === cfgGrp; });
  var h = '', lg = '';
  for (var i = 0; i < pp.length; i++) {
    var p = pp[i];
    if (p.g !== lg) { h += '<div class="prgtitle">▸ Grupo ' + p.g + '</div>'; lg = p.g; }
    var pk = pronos[cfgPart] ? pronos[cfgPart][p.id] : null;
    var pl = '', pv = '';
    if (pk) { var pp2 = pk.split('-'); pl = pp2[0]; pv = pp2[1]; }
    h += '<div class="prrow">' +
      '<div class="prteam r">' + p.l.e + ' ' + p.l.n + '</div>' +
      '<input class="prinp" id="pi-l-' + p.id + '" type="number" inputmode="numeric" min="0" max="99" value="' + pl + '" placeholder="0">' +
      '<span class="prsep">–</span>' +
      '<input class="prinp" id="pi-v-' + p.id + '" type="number" inputmode="numeric" min="0" max="99" value="' + pv + '" placeholder="0">' +
      '<div class="prteam">' + p.v.n + ' ' + p.v.e + '</div>' +
    '</div>';
  }
  document.getElementById('cfgform').innerHTML = h;
}
function saveAllPronos() {
  if (!cfgPart) { alert('Selecciona un jugador primero'); return; }
  if (!pronos[cfgPart]) pronos[cfgPart] = {};
  var pp = P.slice();
  if (cfgGrp) pp = pp.filter(function(x) { return x.g === cfgGrp; });
  for (var i = 0; i < pp.length; i++) {
    var p = pp[i];
    var li = document.getElementById('pi-l-' + p.id);
    var vi = document.getElementById('pi-v-' + p.id);
    if (li && vi && li.value !== '' && vi.value !== '')
      pronos[cfgPart][p.id] = li.value + '-' + vi.value;
  }
  var btn = document.getElementById('savepronobtn');
  btn.disabled = true;
  btn.textContent = '▸ Guardando...';
  binWrite(getCurrentData(), function(err) {
    btn.disabled = false;
    if (err) {
      btn.textContent = '✗ Error, reintenta';
      setTimeout(function() { btn.textContent = '▸ Guardar Pronósticos'; }, 3000);
    } else {
      btn.textContent = '✓ Guardado en la nube';
      renderRanking();
      setTimeout(function() { btn.textContent = '▸ Guardar Pronósticos'; }, 2500);
    }
  });
}
function addPart() {
  var inp = document.getElementById('cfg-np');
  var n = (inp.value || '').trim();
  if (!n) return;
  if (parts.indexOf(n) >= 0) { alert('Ya existe este participante'); return; }
  parts.push(n);
  if (!pronos[n]) pronos[n] = {};
  inp.value = '';
  binWrite(getCurrentData(), function(err) {
    if (!err) { renderConfig(); populatePkParts(); renderRanking(); }
    else alert('Error al guardar. Comprueba la conexión.');
  });
}
function delPart(i) {
  var n = parts[i];
  if (!confirm('¿Eliminar a ' + n + '?')) return;
  parts.splice(i, 1);
  delete pronos[n];
  binWrite(getCurrentData(), function(err) {
    if (!err) { renderConfig(); populatePkParts(); renderRanking(); }
    else alert('Error al guardar.');
  });
}

/* =====================================================
   NAVEGACIÓN
===================================================== */
var pages = ['ranking','picks','scores','config'];
function goPage(name) {
  for (var i = 0; i < pages.length; i++) {
    document.getElementById('pg-' + pages[i]).className = 'pg';
    document.getElementById('nb-' + pages[i]).className = 'nb';
  }
  document.getElementById('pg-' + name).className = 'pg on';
  document.getElementById('nb-' + name).className = 'nb on';
  curPage = name;
  window.scrollTo(0, 0);
  if (name === 'scores') renderScores();
  if (name === 'picks') { populatePkParts(); renderPicks(); }
  if (name === 'config') renderConfig();
}

/* =====================================================
   TELETEXTO
===================================================== */
function toggleTT() {
  ttMode = !ttMode;
  document.body.className = ttMode ? 'tt' : '';
  document.getElementById('btn-tt').textContent = ttMode ? '🎨 FUTURISTA' : '📺 TELETEXTO';
}

/* =====================================================
   UTILS
===================================================== */
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* =====================================================
   INIT — carga datos desde JSONBin
===================================================== */
function init() {
  document.getElementById('load-msg').textContent = 'Cargando datos...';
  binRead(function(err, data) {
    if (err || !data) {
      // Si falla la red, cargamos demo
      document.getElementById('load-msg').textContent = 'Sin conexión, cargando demo...';
      parts = DEMO.participantes.slice();
      pronos = DEMO.pronos;
      reales = DEMO.resultados;
    } else {
      // Datos del bin — si está vacío o sin estructura, cargar demo
      if (!data.participantes || !data.participantes.length) {
        parts = DEMO.participantes.slice();
        pronos = DEMO.pronos;
        reales = DEMO.resultados;
        // Escribir demo en el bin para la próxima vez
        binWrite(getCurrentData(), null);
      } else {
        parts = data.participantes || [];
        pronos = data.pronos || {};
        reales = data.resultados || {};
      }
    }
    renderRanking();
    populatePkParts();
    // Ocultar pantalla de carga
    var ls = document.getElementById('loadscreen');
    ls.style.opacity = '0';
    ls.style.transition = 'opacity .4s';
    setTimeout(function() { ls.style.display = 'none'; }, 400);
  });
}

init();
</script>
